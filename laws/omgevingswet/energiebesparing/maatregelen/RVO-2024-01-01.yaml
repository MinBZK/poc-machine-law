$id: https://raw.githubusercontent.com/MinBZK/poc-machine-law/refs/heads/main/schema/v0.1.7/schema.json
uuid: 7c2e8f4a-91d3-4e5b-8a6f-2b0c9d1e3f57
name: Erkende maatregelenlijst energiebesparing (EML 2023)
law: omgevingswet/energiebesparing/maatregelen
law_type: FORMELE_WET
legal_character: BESCHIKKING
decision_type: ANDERE_HANDELING
discoverable: BUSINESS
requires_manual_approval: false
valid_from: '2024-01-01'
service: RVO
description: |-
  Bepaling welke erkende maatregelen ter verduurzaming van het energiegebruik voor een bedrijf gelden. De wet draagt alle 149 maatregelen van de algemene bijlagen (VII en XIV) en alle 106 maatregelen van de glastuinbouwbijlagen (VIIaa en XIVa), met per maatregel de uitgangssituatie, de technische en economische randvoorwaarden, het doelmatig beheer en onderhoud en de alternatieve maatregelen, letterlijk zoals vastgesteld. Welke bijlagen gelden volgt uit de aanwijzing in artikel 4.14, tweede lid, en artikel 5.29, tweede lid, van de Omgevingsregeling. De wet stelt niet vast dat aan de randvoorwaarden van een maatregel is voldaan; die geeft zij mee zodat de ondernemer ze kan nagaan.
  Gegenereerd uit de werkboeken van RVO met script/generate-eml-law.py.
legal_basis:
  law: Omgevingsregeling
  bwb_id: BWBR0045528
  article: '4.14'
  url: https://wetten.overheid.nl/BWBR0045528/2024-01-01#Artikel4.14
  juriconnect: jci1.3:c:BWBR0045528&artikel=4.14&z=2024-01-01&g=2024-01-01
  explanation: Artikel 4.14 Omgevingsregeling wijst de maatregelen aan bedoeld in artikel 5.15, vierde
    lid, Bal, en artikel 5.29 die bedoeld in artikel 3.84, vijfde lid, Bbl. Samen vormen die aanwijzingen
    de erkende maatregelenlijst.
references:
- law: Omgevingsregeling, bijlage VII
  article: 4.14, eerste lid
  url: https://wetten.overheid.nl/BWBR0045528/2024-01-01#BijlageVII
- law: Omgevingsregeling, bijlage VIIaa (glastuinbouwsector)
  article: 4.14, tweede lid
  url: https://wetten.overheid.nl/BWBR0045528/2024-01-01#BijlageVIIaa
- law: Omgevingsregeling, bijlage XIV
  article: 5.29, eerste lid
  url: https://wetten.overheid.nl/BWBR0045528/2024-01-01#BijlageXIV
- law: Omgevingsregeling, bijlage XIVa (glastuinbouwsector)
  article: 5.29, tweede lid
  url: https://wetten.overheid.nl/BWBR0045528/2024-01-01#BijlageXIVa
- law: Omgevingsregeling, bijlage XV en XVa (rekenmethodiek terugverdientijd)
  article: 4.14a en 5.30
  url: https://wetten.overheid.nl/BWBR0045528/2024-01-01#BijlageXV
properties:
  parameters:
  - name: TEELT_GEWASSEN_IN_KAS
    description: Teelt het bedrijf gewassen in kassen? Niet als dat alleen bij een huishouden of beroep
      aan huis gebeurt, voor educatieve doeleinden, bij een onderzoeksinstelling of op volkstuinen.
    type: boolean
    required: true
    legal_basis:
      law: Besluit activiteiten leefomgeving
      bwb_id: BWBR0041330
      article: '3.205'
      url: https://wetten.overheid.nl/BWBR0041330/2024-01-01#Artikel3.205
      juriconnect: jci1.3:c:BWBR0041330&artikel=3.205&z=2024-01-01&g=2024-01-01
      explanation: Artikel 3.205 Bal wijst het telen van gewassen in kassen aan als milieubelastende activiteit;
        het derde lid zondert huishoudens, beroep aan huis, educatieve doeleinden, onderzoeksinstellingen
        en volkstuinen uit. De aanwijzing bepaalt of de glastuinbouwbijlagen gelden.
  - name: TEELT_GEWASSEN_IN_GEBOUW_GEEN_KAS
    description: Teelt het bedrijf gewassen in een gebouw dat geen kas is? Niet als dat alleen bij een
      huishouden of beroep aan huis gebeurt, voor educatieve doeleinden of bij een onderzoeksinstelling.
    type: boolean
    required: true
    legal_basis:
      law: Besluit activiteiten leefomgeving
      bwb_id: BWBR0041330
      article: '3.211'
      url: https://wetten.overheid.nl/BWBR0041330/2024-01-01#Artikel3.211
      juriconnect: jci1.3:c:BWBR0041330&artikel=3.211&z=2024-01-01&g=2024-01-01
      explanation: Artikel 3.211 Bal wijst het telen van gewassen in een gebouw, anders dan een kas, aan
        als milieubelastende activiteit; het derde lid zondert huishoudens, beroep aan huis, educatieve
        doelen en onderzoeksinstellingen uit. Deze aanwijzing leidt alleen samen met het verlaagde energiebelastingtarief
        tot de glastuinbouwbijlagen.
  - name: MAAKT_GEBRUIK_VAN_VERLAAGD_ENERGIEBELASTINGTARIEF
    description: Maakt het bedrijf gebruik van het verlaagde energiebelastingtarief voor de glastuinbouw?
    type: boolean
    required: true
    legal_basis:
      law: Wet belastingen op milieugrondslag
      bwb_id: BWBR0007168
      article: '60'
      url: https://wetten.overheid.nl/BWBR0007168/2024-01-01#Artikel60
      juriconnect: jci1.3:c:BWBR0007168&artikel=60&lid=1&z=2024-01-01&g=2024-01-01
      explanation: Artikel 60, eerste lid, Wet belastingen op milieugrondslag regelt het verlaagde tarief
        voor de glastuinbouw. Dat tarief verandert de terugverdientijd en is daarom in artikel 4.14, tweede
        lid, en artikel 5.29, tweede lid, van de Omgevingsregeling voorwaarde voor de glastuinbouwbijlagen.
      paragraph: '1'
  - name: AANWEZIGE_CATEGORIEEN
    description: De categorieen uit de erkende maatregelenlijst die bij het bedrijf voorkomen, bijvoorbeeld
      Perslucht of Binnenverlichting.
    type: array
    required: true
    legal_basis:
      law: Besluit activiteiten leefomgeving
      bwb_id: BWBR0041330
      article: '5.15'
      url: https://wetten.overheid.nl/BWBR0041330/2024-01-01#Artikel5.15
      juriconnect: jci1.3:c:BWBR0041330&artikel=5.15&lid=1&z=2024-01-01&g=2024-01-01
      explanation: Artikel 5.15, eerste lid, Bal verplicht tot maatregelen met een terugverdientijd van
        ten hoogste vijf jaar. Een maatregel kan alleen gelden als de installatie of het gebouwdeel waarop
        hij ziet aanwezig is; die feitelijke situatie geeft de ondernemer op.
      paragraph: '1'
  output:
  - name: is_glastuinbouwsector
    description: Gelden voor dit bedrijf de bijlagen die specifiek voor de glastuinbouwsector zijn vastgesteld?
    type: boolean
    temporal: &id001
      type: point_in_time
      reference: $calculation_date
    citizen_relevance: primary
    legal_basis:
      law: Omgevingsregeling
      bwb_id: BWBR0045528
      article: '4.14'
      url: https://wetten.overheid.nl/BWBR0045528/2024-01-01#Artikel4.14
      juriconnect: jci1.3:c:BWBR0045528&artikel=4.14&lid=2&z=2024-01-01&g=2024-01-01
      explanation: Artikel 4.14, tweede lid, en artikel 5.29, tweede lid, van de Omgevingsregeling wijzen
        de glastuinbouwbijlagen aan bij een activiteit als bedoeld in artikel 3.205 van het Besluit activiteiten
        leefomgeving (telen van gewassen in kassen), of bij een activiteit als bedoeld in artikel 3.211
        van dat besluit (telen van gewassen in een gebouw, anders dan een kas) waarbij gebruik wordt gemaakt
        van het tarief, bedoeld in artikel 60, eerste lid, van de Wet belastingen op milieugrondslag.
      paragraph: '2'
  - name: bijlage_milieubelastende_activiteiten
    description: De bijlage bij de Omgevingsregeling met de maatregelen voor milieubelastende activiteiten
      (onderdelen Faciliteiten en Processen).
    type: string
    temporal: *id001
    citizen_relevance: secondary
    legal_basis:
      law: Omgevingsregeling
      bwb_id: BWBR0045528
      article: '4.14'
      url: https://wetten.overheid.nl/BWBR0045528/2024-01-01#Artikel4.14
      juriconnect: jci1.3:c:BWBR0045528&artikel=4.14&z=2024-01-01&g=2024-01-01
      explanation: Artikel 4.14 Omgevingsregeling wijst bijlage VII aan als de maatregelen bedoeld in
        artikel 5.15, vierde lid, Bal, en in afwijking daarvan bijlage VIIaa voor de glastuinbouwsector.
  - name: bijlage_gebouwen
    description: De bijlage bij de Omgevingsregeling met de maatregelen voor gebouwen (onderdeel Gebouwen).
    type: string
    temporal: *id001
    citizen_relevance: secondary
    legal_basis:
      law: Omgevingsregeling
      bwb_id: BWBR0045528
      article: '5.29'
      url: https://wetten.overheid.nl/BWBR0045528/2024-01-01#Artikel5.29
      juriconnect: jci1.3:c:BWBR0045528&artikel=5.29&z=2024-01-01&g=2024-01-01
      explanation: Artikel 5.29 Omgevingsregeling wijst bijlage XIV aan als de maatregelen bedoeld in
        artikel 3.84, vijfde lid, Bbl, en in afwijking daarvan bijlage XIVa voor de glastuinbouwsector.
  - name: maatregelen
    description: De erkende maatregelen uit de voor dit bedrijf geldende bijlagen, in de categorieen die
      bij het bedrijf voorkomen, met de randvoorwaarden waaronder elke maatregel geldt.
    type: array
    temporal: *id001
    citizen_relevance: primary
    legal_basis:
      law: Besluit activiteiten leefomgeving
      bwb_id: BWBR0041330
      article: '5.15'
      url: https://wetten.overheid.nl/BWBR0041330/2024-01-01#Artikel5.15
      juriconnect: jci1.3:c:BWBR0041330&artikel=5.15&lid=4&z=2024-01-01&g=2024-01-01
      explanation: Artikel 5.15, vierde lid, Bal bepaalt dat bij ministeriele regeling maatregelen worden
        aangewezen die in ieder geval een terugverdientijd van ten hoogste vijf jaar hebben; artikel 3.84,
        vijfde lid, Bbl doet dat voor gebouwen. De aangewezen maatregelen gelden onder de randvoorwaarden
        die de bijlage per maatregel noemt.
      paragraph: '4'
  - name: aantal_maatregelen
    description: Het aantal erkende maatregelen dat op het bedrijf van toepassing kan zijn.
    type: number
    temporal: *id001
    citizen_relevance: secondary
    legal_basis:
      law: Besluit activiteiten leefomgeving
      bwb_id: BWBR0041330
      article: '5.15'
      url: https://wetten.overheid.nl/BWBR0041330/2024-01-01#Artikel5.15
      juriconnect: jci1.3:c:BWBR0041330&artikel=5.15&lid=4&z=2024-01-01&g=2024-01-01
      explanation: Telling van de op grond van artikel 5.15, vierde lid, Bal en artikel 3.84, vijfde lid,
        Bbl aangewezen maatregelen die in de aanwezige categorieen vallen.
      paragraph: '4'
  definitions:
    MAATREGELEN_ALGEMEEN:
    - code: FA1
      onderdeel: Faciliteiten
      categorie: Perslucht
      bijlage: VII
      naam: Vergroot de persluchtbuffer.
      omschrijving: Door het aansluiten van een (extra) buffervat op het bestaande persluchtnet kan meer
        perslucht opgeslagen worden, waardoor het aantal starts en stops van de compressor wordt beperkt.
      uitgangssituatie: Er is een persluchtcompressor met aan/uit-schakelaar aanwezig zonder buffervat
        of met een te klein buffervat. Hierdoor draait de persluchtinstallatie minimaal 15 minuten per
        bedrijfsuur in nullast. Bij vergroting van de buffer is het uitgangspunt om maximaal 5 minuten
        aaneengesloten in nullast te draaien.
      doelmatig_beheer_en_onderhoud: Controleer regelmatig op persluchtlekkages en verhelp deze.
      technische_randvoorwaarden:
      - id: '8'
        randvoorwaarde: Er is voldoende ruimte nabij de persluchtcompressor om een persluchtbuffervat
          te plaatsen.
      - id: '588'
        randvoorwaarde: De persluchtvraag is gemiddeld gezien variabel gedurende een bedrijfsuur.
      - id: '593'
        randvoorwaarde: De persluchtcompressor heeft een vermogen van minimaal 10 kW.
      economische_randvoorwaarden:
      - id: '9754'
        realisatiemoment: Zelfstandig moment
        randvoorwaarde: Bij meer dan 4.100 bedrijfsuren van het persluchtnet per jaar.
      - id: '9755'
        realisatiemoment: Natuurlijk moment
        randvoorwaarde: Bij meer dan 3.400 bedrijfsuren van het persluchtnet per jaar.
      alternatieve_maatregelen: []
    - code: FA2
      onderdeel: Faciliteiten
      categorie: Perslucht
      bijlage: VII
      naam: Plaats een afsluiter met tijdschakelaar om verlies van perslucht buiten bedrijfstijden te
        beperken.
      omschrijving: Door het toepassen van een afsluiter met tijdschakelaar op het persluchtnet of delen
        daarvan kunnen apparaten en machines worden losgekoppeld van de perslucht. Zo hoeft de compressor
        niet onnodig perslucht te comprimeren buiten bedrijfstijden.
      uitgangssituatie: Er is een centraal persluchtnet aanwezig dat geheel of deels onder druk staat
        buiten gebruikstijden.
      doelmatig_beheer_en_onderhoud: |-
        Controleer regelmatig op persluchtlekkages en verhelp deze.

        Controleer regelmatig de instelling van de tijden dat het persluchtnet buiten bedrijf is en zorg dat deze bij veranderende bedrijfstijden (zoals bij zomer- en wintertijd) worden bijgewerkt.
      technische_randvoorwaarden:
      - id: '541'
        randvoorwaarde: De op het persluchtnet aangesloten apparaten en machines zijn geschikt om zonder
          persluchtdruk buiten bedrijf stil te staan.
      economische_randvoorwaarden: []
      alternatieve_maatregelen: []
    - code: FA3
      onderdeel: Faciliteiten
      categorie: Perslucht
      bijlage: VII
      naam: Pas een flow-drukregelaar toe in het persluchtnet.
      omschrijving: |-
        Door integratie van een flow-drukregelaar (regelklep direct na het buffervat) in een persluchtnet kunnen schommelingen in de persluchtvraag worden uitgebalanceerd. Om de schommelingen op te vangen is de persdruk vaak hoger ingesteld dan nodig. Door toepassing van een flow-drukregelaar kan de persdruk in het buffervat worden verlaagd. De verlaging in persdruk zorgt voor een besparing op het energiegebruik van de compressor.

        Daarbij zal door lagere druk het persluchtgebruik per gebruiker afnemen en lekt er minder perslucht weg. Door minder persluchtgebruik of -lekkage zal de compressor ook energie besparen.
      uitgangssituatie: Er is een persluchtnet met een centrale toerengeregelde persluchtcompressor(en)
        en buffervat aanwezig, waarbij een flow-drukregelaar ontbreekt.
      doelmatig_beheer_en_onderhoud: Verlaag de persluchtdruk na plaatsing van de schakelaar en controleer
        regelmatig de ingestelde waarde.
      technische_randvoorwaarden:
      - id: '549'
        randvoorwaarde: Het vermogen van de compressor is ten hoogste 45 kW en het persluchtgebruik is
          maximaal 7 m³/min.
      - id: '326'
        randvoorwaarde: In het persluchtnet vinden hoge drukvallen plaats door grote persluchtafname.
      economische_randvoorwaarden:
      - id: '9756'
        realisatiemoment: Zowel natuurlijk als zelstandig moment
        randvoorwaarde: Bij meer dan 3.700 bedrijfsuren van het persluchtnet per jaar.
      alternatieve_maatregelen: []
    - code: FA4
      onderdeel: Faciliteiten
      categorie: Perslucht
      bijlage: VII
      naam: Plaats een luchtkanaal zodat de persluchtcompressor (koude) buitenlucht aanzuigt.
      omschrijving: Plaats een luchtkanaal voor het aanzuigen van buitenlucht of van binnenlucht uit een
        onverwarmde ruimte. Als de persluchtcompressor koudere lucht aanzuigt kan er energiezuiniger perslucht
        worden gemaakt.
      uitgangssituatie: Er is een centraal persluchtnet aanwezig met een persluchtcompressor van ten minste
        7,5 kW die warme lucht aanzuigt vanuit de ruimte waarin deze is opgesteld.
      doelmatig_beheer_en_onderhoud: Niet van toepassing.
      technische_randvoorwaarden:
      - id: '738'
        randvoorwaarde: De compressor staat binnen 5 m van een buitenmuur.
      economische_randvoorwaarden:
      - id: '9757'
        realisatiemoment: Zowel natuurlijk als zelstandig moment
        randvoorwaarde: Bij meer dan 3.000 bedrijfsuren van de persluchtcompressor per jaar.
      alternatieve_maatregelen: []
    - code: FA5
      onderdeel: Faciliteiten
      categorie: Perslucht
      bijlage: VII
      naam: Gebruik zuinige persluchtgereedschappen.
      omschrijving: Door gebruik te maken van nieuwe en energiezuinige perslucht aangedreven gereedschappen,
        zoals blaaspistolen, wordt er minder perslucht gebruikt en energie bespaard.
      uitgangssituatie: Er wordt gebruik gemaakt van 'conventionele' persluchtgereedschappen, zoals blaaspistolen,
        met een nominaal gebruik van meer dan 120 l/min.
      doelmatig_beheer_en_onderhoud: |-
        Onderhoud de perslucht aangedreven gereedschappen zodat er geen onnodige perslucht verloren gaat en houd ze schoon.

        Controleer regelmatig op persluchtlekkages aan gereedschap, koppelingen en leidingen en verhelp deze.
      technische_randvoorwaarden:
      - id: '546'
        randvoorwaarde: De persluchtcompressoren hoeven niet te worden aangepast door het verminderde
          gebruik van perslucht.
      economische_randvoorwaarden:
      - id: '9758'
        realisatiemoment: Zelfstandig moment
        randvoorwaarde: Bij gereedschappen die meer dan 1.800 uur per jaar worden gebruikt.
      alternatieve_maatregelen:
      - naam: Maak gebruik van elektrische gereedschappen.
        omschrijving: Door waar mogelijk elektrisch handgereedschap toe te passen en perslucht aangedreven
          gereedschap alleen te gebruiken wanneer er geen elektrisch alternatief is, kan het persluchtgebruik
          worden beperkt.
    - code: FA6
      onderdeel: Faciliteiten
      categorie: Perslucht
      bijlage: VII
      naam: Gebruik elektrisch handgereedschap als vervanging voor pneumatisch aangedreven gereedschap.
      omschrijving: Door waar mogelijk elektrisch handgereedschap toe te passen en perslucht aangedreven
        gereedschap alleen te gebruiken wanneer er geen elektrisch alternatief is, kan het persluchtgebruik
        worden beperkt. Het opwekken van perslucht voor het aandrijven van gereedschap is minder efficiënt
        dan het gebruiken van elektrisch aangedreven gereedschap.
      uitgangssituatie: Persluchtaangedreven handgereedschap wordt gebruikt voor toepassingen waar een
        elektrisch alternatief voor kan worden gebruikt.
      doelmatig_beheer_en_onderhoud: Niet van toepassing.
      technische_randvoorwaarden:
      - id: '552'
        randvoorwaarde: De gereedschappen worden niet in een ATEX omgeving gebruikt.
      - id: '551'
        randvoorwaarde: Er is een geschikt elektrisch alternatief beschikbaar dat voldoet aan de specifieke
          eisen van de werkzaamheden zoals voldoende koppel en een handzaam gewicht en formaat.
      economische_randvoorwaarden:
      - id: '9759'
        realisatiemoment: Zelfstandig moment
        randvoorwaarde: Bij gebruik van het gereedschap van meer dan 6 u/wk.
      alternatieve_maatregelen: []
    - code: FA7
      onderdeel: Faciliteiten
      categorie: Perslucht
      bijlage: VII
      naam: Gebruik een blower voor het schoonblazen in plaats van perslucht.
      omschrijving: Voor werkzaamheden zoals schoonblazen van vloeren en machines waarbij met perslucht
        wordt geblazen kan een decentrale blower worden gebruikt. Dit is energiezuiniger dan blazen met
        perslucht.
      uitgangssituatie: Blazen gebeurt met perslucht van ten minste 6 bar.
      doelmatig_beheer_en_onderhoud: Niet van toepassing.
      technische_randvoorwaarden:
      - id: '535'
        randvoorwaarde: Het proces moet toestaan dat er met een lagere druk en groter luchtvolume schoongeblazen
          wordt.
      - id: '536'
        randvoorwaarde: De blower is binnen 10 m van de toepassing te plaatsen.
      economische_randvoorwaarden:
      - id: '9761'
        realisatiemoment: Zelfstandig moment
        randvoorwaarde: Bij gebruik van perslucht voor schoonblazen van meer dan 6 u/wk.
      alternatieve_maatregelen: []
    - code: FA8
      onderdeel: Faciliteiten
      categorie: Perslucht
      bijlage: VII
      naam: Vervang de regelklepbediening op basis van perslucht door elektrische aandrijvingen.
      omschrijving: Door het op perslucht aangedreven besturend element (actuator) van de regelklep te
        vervangen door een servo- of stappenmotor, kan energie worden bespaard. Bij een perslucht aangedreven
        actuator moet het gehele jaar lucht op druk worden gehouden. Daarom is een elektrische aandrijving
        efficiënter.
      uitgangssituatie: Er is een regelklep met een door perslucht aangedreven actuator (besturend element)
        aanwezig die is aangesloten op het centrale persluchtnet. De actuator kan separaat worden vervangen.
      doelmatig_beheer_en_onderhoud: Niet van toepassing.
      technische_randvoorwaarden:
      - id: '538'
        randvoorwaarde: De regelklep bevindt zich niet in een ATEX-omgeving.
      - id: '464'
        randvoorwaarde: Er is een elektrische voedingskast beschikbaar binnen 10 m.
      economische_randvoorwaarden:
      - id: '9762'
        realisatiemoment: Natuurlijk moment
        randvoorwaarde: Bij processen die het hele jaar continu in bedrijf zijn.
      alternatieve_maatregelen: []
    - code: FB1
      onderdeel: Faciliteiten
      categorie: Stoom
      bijlage: VII
      naam: Verlaag de stoomdruk van het centrale stoomnet.
      omschrijving: Een verlaging van de stoomdruk zorgt voor lagere (stoom)temperaturen en voor een lagere
        schoorsteentemperatuur. Daardoor verliest de ketel minder warmte en wordt het warmteverlies door
        de schoorsteen kleiner. Bovendien neemt het verlies in het (stoom)distributienet en het flashverlies
        in condenspotten af. De mate van verlaging van de stoomdruk wordt bepaald door de stoomafnemer
        die om de hoogste stoomdruk vraagt om te kunnen blijven opereren.
      uitgangssituatie: Er is een stoomketel aanwezig die is gekoppeld aan een centraal stoomnet en de
        druk op het stoomnet is hoger dan voor de aangesloten apparaten vereist is.
      doelmatig_beheer_en_onderhoud: Controleer regelmatig de stoomdruk in het stoomnet.
      technische_randvoorwaarden:
      - id: '680'
        randvoorwaarde: De stoomdruk kan met ten minste 10% worden verlaagd.
      - id: '642'
