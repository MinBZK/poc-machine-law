        neemt de efficiëntie van het oplaadproces fors toe. Tractiebatterijen worden gebruikt in voertuigen
        voor intern transport zoals vorkheftrucks.
      uitgangssituatie: Er is een lader voor tractiebatterijen aanwezig die niet als hoogfrequente HR-lader
        is uitgevoerd.
      doelmatig_beheer_en_onderhoud: Niet van toepassing.
      technische_randvoorwaarden:
      - id: '372'
        randvoorwaarde: De huidige accu's zijn geschikt voor hoogfrequent laden.
      economische_randvoorwaarden:
      - id: '19021'
        realisatiemoment: Zelfstandig moment
        randvoorwaarde: Bij meer dan 400 laadcycli per jaar.
      alternatieve_maatregelen: []
    - code: PD9
      onderdeel: Processen
      categorie: Procesapparatuur
      bijlage: VIIaa
      naam: Vervang aanwezige verlichting op of nabij procesapparatuur door LED-verlichting.
      omschrijving: Door het vervangen van TL-buizen (TL8), spaar-, halogeen- of gasontladingslampen door
        LED-lampen wordt het energiegebruik van de verlichting beperkt.
      uitgangssituatie: Er is verlichting aanwezig op of nabij procesapparatuur die niet is voorzien van
        LED-lampen.
      doelmatig_beheer_en_onderhoud: Reinig regelmatig de lampen, armaturen, reflectoren en sensoren van
        de regelingen die erbij horen.
      technische_randvoorwaarden:
      - id: '732'
        randvoorwaarde: De bestaande lampen zijn eenvoudig bereikbaar en kunnen één-op-één worden vervangen
          door LED-lampen.
      economische_randvoorwaarden:
      - id: '18944'
        realisatiemoment: Zelfstandig moment
        randvoorwaarde: Bij meer dan 1.300 branduren per jaar.
      alternatieve_maatregelen: []
    - code: PE2
      onderdeel: Processen
      categorie: Proceswarmte
      bijlage: VIIaa
      naam: Isoleer warme productleidingen en appendages.
      omschrijving: Door het aanbrengen van isolatiemateriaal met een Rd-waarde van minimaal 1,5 m²K/W
        om leidingen en appendages waarin warme producten worden verplaatst wordt het warmteverlies beperkt.
      uitgangssituatie: Er zijn warme productleidingen en appendages zonder isolatie aanwezig.
      doelmatig_beheer_en_onderhoud: Controleer regelmatig de staat van de isolatie en herstel het materiaal
        bij eventuele schade.
      technische_randvoorwaarden:
      - id: '301'
        randvoorwaarde: De leidingen en appendages zijn goed bereikbaar.
      economische_randvoorwaarden: []
      alternatieve_maatregelen: []
    - code: PT1
      onderdeel: Processen
      categorie: Glastuinbouw
      bijlage: VIIaa
      naam: Pas meerdere schakelgroepen toe bij de groeibelichting in de kas.
      omschrijving: Het kan voorkomen dat niet alle delen van de kas volgens hetzelfde regime belicht
        hoeven te worden. Door toepassing van schakelgroepen wordt voorkomen dat in sommige delen van
        de kas de verlichting onnodig brandt.
      uitgangssituatie: Er zijn te grote schakelgroepen aanwezig, waardoor delen van de kas onnodig worden
        belicht.
      doelmatig_beheer_en_onderhoud: Controleer regelmatig de instellingen per schakelgroep.
      technische_randvoorwaarden:
      - id: '755'
        randvoorwaarde: De route van de bekabeling in de kas moet geschikt zijn om meerdere schakelgroepen
          toe te passen.
      economische_randvoorwaarden:
      - id: '19004'
        realisatiemoment: Zelfstandig moment
        randvoorwaarde: Als meer dan 10% van de verlichting gedurende ten minste 700 uur per jaar kan
          worden uitgeschakeld.
      alternatieve_maatregelen: []
    - code: PT2
      onderdeel: Processen
      categorie: Glastuinbouw
      bijlage: VIIaa
      naam: Pas een set van meerdere en specifieke sensoren toe in een kasafdeling voor een betere beheersing
        van het binnenklimaat.
      omschrijving: Door de plaatsing van een mobiele set sensoren in een kasafdeling,  kan met name de
        temperatuur, maar ook de lucht- en bodemvochtigheid of de bladtemperatuur gerichter gemeten worden.
        Hierdoor kunnen mankementen, die zich bijvoorbeeld uiten door plekken met mindere groei, eerder
        worden gesignaleerd en opgelost. De mobiele set wordt steeds op een andere plek in de kas geplaatst,
        waardoor één mobiele set volstaat.
      uitgangssituatie: Het klimaat in de kas wordt geregeld door slechts één of enkele  temperatuurmetingen
        per klimaatafdeling.
      doelmatig_beheer_en_onderhoud: Maak sensoren regelmatig schoon en controleer of ze goed aangesloten
        zijn.
      technische_randvoorwaarden:
      - id: '776'
        randvoorwaarde: Het klimaat moet binnen de kasafdeling in meerdere groepen te regelen zijn.
      economische_randvoorwaarden:
      - id: '19007'
        realisatiemoment: Zelfstandig en natuurlijk moment
        randvoorwaarde: Bij een gasgebruik van ten minste 12 m³ per m² kasoppervlak per jaar.
      alternatieve_maatregelen: []
    - code: PT3
      onderdeel: Processen
      categorie: Glastuinbouw
      bijlage: VIIaa
      naam: Pas een frequentieregeling toe op de circulatiepompen van de CV-installatie van de kas.
      omschrijving: Door het toepassen van een frequentieregelaar op de circulatiepomp(en) van het verwarmingssysteem
        van de kas, kan het debiet van de pomp(en) worden aangepast aan de warmtevraag. De pomp werkt
        efficiënter, doordat die optimaal worden ingeregeld. Het werkpunt van de pomp wordt zodanig gekozen
        dat de pomp zijn functie steeds goed kan vervullen met een zo laag mogelijk opgenomen vermogen.
        Een pompregeling op basis van de warmtevraag zorgt ervoor dat niet meer warmte naar de kas wordt
        toegevoerd dan nodig is.
      uitgangssituatie: |-
        Er is een gesmoorde en ongeregelde circulatiepomp aanwezig van ten minste 3 kW, die wordt aangedreven door een elektromotor van efficiëntieklasse IE2 of hoger.

        De transportpompen van het verwarmingssysteem van de kas zijn niet voorzien van frequentieregeling.
      doelmatig_beheer_en_onderhoud: Controleer regelmatig de instellingen van de pompen en de werking
        van de temperatuursensoren in de kas.
      technische_randvoorwaarden:
      - id: '774'
        randvoorwaarde: Er is voldoende ruimte in de regelkast om de frequentieregelaar te kunnen plaatsen
          of de frequentieregelaar kan nabij de pomp worden geplaatst.
      economische_randvoorwaarden:
      - id: '19003'
        realisatiemoment: Zelfstandig moment
        randvoorwaarde: Bij meer dan 3.000 draaiuren van de pomp per jaar.
      alternatieve_maatregelen: []
    - code: PT4
      onderdeel: Processen
      categorie: Glastuinbouw
      bijlage: VIIaa
      naam: Breng een horizontaal transparant beweegbaar energiescherm in de kas aan als tweede scherm.
      omschrijving: Door het aanbrengen van een transparant tweede energiescherm wordt het warmteverlies
        via het kasdek beperkt en is er minder energie nodig om de kas warm te houden. Het scherm moet
        minimaal 90% luchtdicht zijn. Het energiescherm wordt gesloten als de temperatuur buiten lager
        is dan binnen en er geen zoninstraling is. Als er wel zoninstraling is, is het sluiten van het
        energiescherm afhankelijk van de teelt en sterkte van de zonstraling. Het scherm wordt geplaatst
        ter hoogte van het bovenkokerprofiel van de tralie of ter hoogte van het onderkokerprofiel van
        de tralie.
      uitgangssituatie: Er is een eerste niet-transparant energiescherm aanwezig in de kas.
      doelmatig_beheer_en_onderhoud: |-
        Bij bovenmatig slijtage moet het doek worden vervangen.

        Geef het scherm jaarlijks een onderhoudsbeurt.
      technische_randvoorwaarden:
      - id: '760'
        randvoorwaarde: Er moet voldoende ruimte zijn in de kas op de bovenligger of de onderligger van
          de tralie, om een extra scherm te kunnen plaatsen.
      - id: '766'
        randvoorwaarde: De kopgevels van de kas moeten voldoende sterk zijn uitgevoerd, zodat deze de
          trekkracht van het extra scherm aankunnen.
      - id: '781'
        randvoorwaarde: De kas wordt verwarmd door middel van een verwarmingsketel.
      economische_randvoorwaarden:
      - id: '19009'
        realisatiemoment: Zelfstandig moment
        randvoorwaarde: Bij een gasgebruik van ten minste 18 m³ per m² kasoppervlak per jaar.
      - id: '19010'
        realisatiemoment: Natuurlijk moment
        randvoorwaarde: Bij een gasgebruik van ten minste 14 m³ per m² kasoppervlak per jaar.
      alternatieve_maatregelen: []
    - code: PT5
      onderdeel: Processen
      categorie: Glastuinbouw
      bijlage: VIIaa
      naam: Isoleer de verwarmingsleidingen en appendages op plekken waar warmte niet nodig is.
      omschrijving: Door het toepassen van isolatiemateriaal met een Rd-waarde van ten minste 0,5 m2K/W
        om de verwarmingsleidingen en appendages wordt het warmteverlies beperkt op plekken in de kas
        waar warmte niet nodig is. In de kas gaat het onder andere om waar de transportleiding de kas
        binnenkomt, boven het middenpad en op plekken waar warmte zich ophoopt. Het betreft alleen bovengrondse
        leidingen.
      uitgangssituatie: Er ontbreekt isolatie om de verwarmingsleidingen en appendages op plekken waar
        geen warmte nodig is.
      doelmatig_beheer_en_onderhoud: |-
        Controleer regelmatig het isolatiemateriaal rond leidingen en appendages en zorg dat dit goed bevestigd is.

        Herstel het materiaal bij eventuele schade.
      technische_randvoorwaarden:
      - id: '781'
        randvoorwaarde: De kas wordt verwarmd door middel van een verwarmingsketel.
      economische_randvoorwaarden: []
      alternatieve_maatregelen: []
    - code: PT6
      onderdeel: Processen
      categorie: Glastuinbouw
      bijlage: VIIaa
      naam: Vervang bij de groeibelichting SON-T armaturen door LED-armaturen.
      omschrijving: LED-lampen hebben een hogere lichtopbrengst per Watt dan SON-T lampen. Het energiegebruik
        van LED-lampen is daardoor lager dan van SON-T lampen bij een gelijk aantal branduren. Bovendien
        hebben LED-lampen een langere leversduur dan SON-T lampen. Bij vervanging door LED moet het hele
        armatuur worden vervangen, het is niet mogelijk alleen de SON-T lamp te vervangen door een LED-lamp.
      uitgangssituatie: Er worden in de kas SON-T armaturen toegepast als groeibelichting.
      doelmatig_beheer_en_onderhoud: Reinig regelmatig de lampen, armaturen, reflectoren en sensoren van
        de regelingen die erbij horen.
      technische_randvoorwaarden:
      - id: '777'
        randvoorwaarde: De teelt moet qua lichtspectrum en warmtebalans in de kas geschikt zijn voor de
          toepassing van LED-groeibelichting.
      economische_randvoorwaarden:
      - id: '19070'
        realisatiemoment: Natuurlijk moment
        randvoorwaarde: Bij ten minste 2.000 belichtingsuren per jaar.
      alternatieve_maatregelen: []
    - code: PT7
      onderdeel: Processen
      categorie: Glastuinbouw
      bijlage: VIIaa
      naam: Vervang circulatieventilatoren van klasse IE2 of lager door gelijkstroom circulatieventilatoren.
      omschrijving: In de glastuinbouw wordt gebruik gemaakt van serieventilatoren om de temperatuur in
        de kas homogeen te krijgen. Dit zijn ventilatoren die zorgen voor een horizontale luchtstroom
        die luchtcirculatie door de gehele kas verzorgt. Door het gebruik van energiezuinige gelijkstroom
        circulatieventilatoren, neemt de efficiëntie van de ventilatie toe en wordt energie bespaard.
      uitgangssituatie: Er zijn in de kas ventilatoren van klasse IE2 of lager aanwezig.
      doelmatig_beheer_en_onderhoud: |-
        Maak de ventilatoren regelmatig schoon.

        Laat regelmatig testen of de ventilatoren optimaal functioneren.
      technische_randvoorwaarden: []
      economische_randvoorwaarden: []
      alternatieve_maatregelen: []
