actions:
- output: is_glastuinbouwsector
  operation: OR
  values:
  - $TEELT_GEWASSEN_IN_KAS
  - operation: AND
    values:
    - $TEELT_GEWASSEN_IN_GEBOUW_GEEN_KAS
    - $MAAKT_GEBRUIK_VAN_VERLAAGD_ENERGIEBELASTINGTARIEF
  legal_basis:
    law: Omgevingsregeling
    bwb_id: BWBR0045528
    article: '4.14'
    url: https://wetten.overheid.nl/BWBR0045528/2024-01-01#Artikel4.14
    juriconnect: jci1.3:c:BWBR0045528&artikel=4.14&lid=2&z=2024-01-01&g=2024-01-01
    explanation: Artikel 4.14, tweede lid, en artikel 5.29, tweede lid, van de Omgevingsregeling wijzen
      de glastuinbouwbijlagen aan bij een activiteit als bedoeld in artikel 3.205 van het Besluit activiteiten
      leefomgeving (telen van gewassen in kassen), of bij een activiteit als bedoeld in artikel 3.211
      van dat besluit (telen van gewassen in een gebouw, anders dan een kas) waarbij gebruik wordt gemaakt
      van het tarief, bedoeld in artikel 60, eerste lid, van de Wet belastingen op milieugrondslag.
    paragraph: '2'
- output: bijlage_milieubelastende_activiteiten
  operation: IF
  conditions:
  - test: $is_glastuinbouwsector
    then: VIIaa
  - else: VII
  legal_basis:
    law: Omgevingsregeling
    bwb_id: BWBR0045528
    article: '4.14'
    url: https://wetten.overheid.nl/BWBR0045528/2024-01-01#Artikel4.14
    juriconnect: jci1.3:c:BWBR0045528&artikel=4.14&z=2024-01-01&g=2024-01-01
    explanation: Bijlage VII geldt, tenzij de aanwijzing van het tweede lid opgaat; dan geldt bijlage
      VIIaa.
- output: bijlage_gebouwen
  operation: IF
  conditions:
  - test: $is_glastuinbouwsector
    then: XIVa
  - else: XIV
  legal_basis:
    law: Omgevingsregeling
    bwb_id: BWBR0045528
    article: '5.29'
    url: https://wetten.overheid.nl/BWBR0045528/2024-01-01#Artikel5.29
    juriconnect: jci1.3:c:BWBR0045528&artikel=5.29&z=2024-01-01&g=2024-01-01
    explanation: Bijlage XIV geldt, tenzij de aanwijzing van het tweede lid opgaat; dan geldt bijlage
      XIVa.
- output: maatregelen
  operation: FOREACH
  subject:
    operation: IF
    conditions:
    - test: $is_glastuinbouwsector
      then: $MAATREGELEN_GLASTUINBOUW
    - else: $MAATREGELEN_ALGEMEEN
  where:
    operation: IN
    subject: $current.categorie
    values: $AANWEZIGE_CATEGORIEEN
  value: $current
  legal_basis:
    law: Besluit activiteiten leefomgeving
    bwb_id: BWBR0041330
    article: '5.15'
    url: https://wetten.overheid.nl/BWBR0041330/2024-01-01#Artikel5.15
    juriconnect: jci1.3:c:BWBR0041330&artikel=5.15&lid=4&z=2024-01-01&g=2024-01-01
    explanation: 'Uit de voor het bedrijf geldende bijlagen worden de maatregelen genomen in de categorieen
      die bij het bedrijf voorkomen. De randvoorwaarden blijven bij de maatregel staan: de bijlage wijst
      de maatregel aan onder die voorwaarden, en de wet stelt niet vast dat eraan voldaan is.'
    paragraph: '4'
- output: aantal_maatregelen
  operation: LENGTH
  subject: $maatregelen
  legal_basis:
    law: Besluit activiteiten leefomgeving
    bwb_id: BWBR0041330
    article: '5.15'
    url: https://wetten.overheid.nl/BWBR0041330/2024-01-01#Artikel5.15
    juriconnect: jci1.3:c:BWBR0041330&artikel=5.15&lid=4&z=2024-01-01&g=2024-01-01
    explanation: Telling van de aangewezen maatregelen die in de aanwezige categorieen vallen.
    paragraph: '4'
