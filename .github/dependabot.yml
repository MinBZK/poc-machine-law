version: 2

# Cooldown: a release has to be five days old before Dependabot opens a version
# update for it. Dependabot's own default has been three days since 2026-07-14;
# raising it here also records the choice, so a future change to that default
# cannot silently shrink the window.
#
# Five days is measured against how fast the registry compromises of the past
# year surfaced - chalk/debug, shai-hulud, and the keyv/cacheable maintainer
# hijack of 2026-08-04 were all detected within hours to days. Those are all
# npm incidents; the same window is applied to the other ecosystems here for
# consistency rather than from separate evidence. With `interval: weekly` the
# practical delay is "at least five days, at most until the next weekly run".
#
# This applies to version updates only. Dependabot *security* updates are
# exempt from cooldown and keep opening immediately, so advisory fixes are not
# delayed by this.
updates:
  # Docker
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns:
          - "*"

  # Python (uv)
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      python-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "behave"
        # behave 1.3.x breaks our tests - stay on 1.2.6

  # Go modules
  - package-ecosystem: gomod
    directory: "/features"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      go-deps:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: "/lac-to-regelspraak"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      go-deps:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: "/machinev2/backend"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      go-deps:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: "/machinev2/machine"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      go-deps:
        patterns:
          - "*"
  - package-ecosystem: gomod
    directory: "/simulator"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      go-deps:
        patterns:
          - "*"

  # npm/pnpm for frontend apps
  - package-ecosystem: npm
    directory: "/analysis/graph"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: "/analysis/laws"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: "/importer"
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
