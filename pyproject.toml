[project]
name = "poc-machine-law"
version = "1.13.0"
description = "Proof of Concept - Machine Law"
readme = "README.md"
requires-python = ">=3.12.0,<3.14"
dependencies = [
    "aiohttp>=3.14.1",
    "anthropic>=0.109.1",
    "behave>=1.2.6,<1.3",
    "bs4>=0.0.2",
    "eventsourcing>=9.3.5",
    "fastapi>=0.136.3",
    "fastmcp>=3.4.2",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.5",
    "jsonschema>=4.23.0",
    "langchain>=1.3.8",
    "langchain-anthropic>=1.4.5",
    "langchain-community>=0.4.2",
    "langchain-mcp-adapters>=0.3.0",
    "langgraph>=0.3.18",
    "markdown>=3.7",
    "mcp>=1.27.2",
    "nest-asyncio>=1.6.0",
    "openai>=2.41.1",
    "openapi-python-client>=0.29.0",
    "pandas>=3.0.3",
    "pillow>=11.3.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.2",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "tavily-python>=0.7.26",
    "tqdm>=4.68.2",
    "uvicorn>=0.49.0",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-playwright>=0.8.0",
    "playwright>=1.60.0",
    "ruff>=0.15.17",
    "openapi-python-client>=0.29.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["features/steps/steps.py", "script", "wallet"]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["I", "SIM", "UP", "F", "LOG", "PIE", "PT", "W"]
fixable = ["ALL"]
task-tags = ["TODO"]
ignore = ["TRY003", "SIM105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
build_command = ""
commit_message = "chore(release): {version}"
tag_format = "v{version}"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "style", "refactor", "test"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.publish]
upload_to_vcs_release = false
